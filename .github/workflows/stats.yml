# Redraws the README's stats tiles (contributions, streaks, profile views, the last year) from
# fresh numbers every six hours, and on demand from the Actions tab.
name: Stats tiles
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: stats
jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node bento/stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node bento/build.mjs
      - name: Commit the new tiles
        run: |
          git add bento/src/stats.json assets/bento
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "Stats tiles: fresh numbers"
          git push
