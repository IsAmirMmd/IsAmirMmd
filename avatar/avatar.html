<!doctype html><html><head><meta charset="utf-8"><style>
:root { --ink:#20211f; --cream:#f4efe7; --sand:#ebe3d6; --paper:#fffdf9; --coral:#fa604e; --coral-soft:#fbdcd4; --blue-soft:#dfe6f7; }
* { margin:0; box-sizing:border-box; } body { background:transparent; }
.a { width:1080px; height:1080px; background:var(--cream); position:relative; overflow:hidden; }
.t { position:absolute; border-radius:56px; }
.me { position:absolute; left:50%; transform:translateX(-50%); width:640px; bottom:-290px; filter: drop-shadow(0 30px 50px rgba(32,33,31,.18)); }
</style></head><body>
<!-- The profile picture: the owner's 3D character (nim-byte's bitty-reel owner3d.js, cut by nimbyte-post's
     bitty-cut.mjs owner-desk) on a blue-soft tile. Screenshot #blue at 1080x1080 for avatar.png. -->

<div class="a" id="blue"><div class="t" style="inset:28px;background:var(--blue-soft)"></div><img class="me" src="owner-desk.png"></div>
</body></html>
